name: Build and Deploy Docker Image

on:
  workflow_run:
    workflows: ["Terraform Apply"]
    types:
      - completed

env:
  AWS_REGION: eu-west-3

jobs:
  wait-for-approval:
    name: Wait for Manual Approval
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: production
    steps:
      - name: Manual Approval Notification
        run: echo "Deployment has been manually approved"

  build-and-deploy:
    name: Build and Deploy Docker Image
    needs: wait-for-approval
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: 1.10.5

      - name: Terraform Init
        run: terraform init

      - name: Get ECR Repository URL
        id: terraform-output
        run: |
          echo "ecr_repository_url=$(terraform output -raw ecr_repository_url)" >> $GITHUB_OUTPUT
          echo "ecs_cluster_name=$(terraform output -raw ecs_cluster_name)" >> $GITHUB_OUTPUT
          echo "ecs_service_name=$(terraform output -raw ecs_service_name)" >> $GITHUB_OUTPUT

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2.0.1

      - name: Build, tag, and push Docker image to Amazon ECR
        id: build-image
        env:
          ECR_REPOSITORY_URL: ${{ steps.terraform-output.outputs.ecr_repository_url }}
        run: |
          # Build the Docker image
          docker build -t $ECR_REPOSITORY_URL:latest .
          
          # Push the Docker image
          docker push $ECR_REPOSITORY_URL:latest
          
          echo "image=$ECR_REPOSITORY_URL:latest" >> $GITHUB_OUTPUT

      - name: Force new deployment of ECS service
        env:
          ECS_CLUSTER: ${{ steps.terraform-output.outputs.ecs_cluster_name }}
          ECS_SERVICE: ${{ steps.terraform-output.outputs.ecs_service_name }}
        run: |
          aws ecs update-service --cluster $ECS_CLUSTER --service $ECS_SERVICE --force-new-deployment

      - name: Verify deployment
        env:
          ECS_CLUSTER: ${{ steps.terraform-output.outputs.ecs_cluster_name }}
          ECS_SERVICE: ${{ steps.terraform-output.outputs.ecs_service_name }}
        run: |
          # Wait for service to stabilize
          aws ecs wait services-stable --cluster $ECS_CLUSTER --services $ECS_SERVICE
          
          # Check deployment status
          DEPLOYMENT_STATUS=$(aws ecs describe-services --cluster $ECS_CLUSTER --services $ECS_SERVICE --query 'services[0].deployments[0].status' --output text)
          
          if [ "$DEPLOYMENT_STATUS" == "PRIMARY" ]; then
            echo "Deployment successful!"
          else
            echo "Deployment failed with status: $DEPLOYMENT_STATUS"
            exit 1
          fi

      - name: Create GitHub Deployment
        uses: chrnorm/deployment-action@v2.0.5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: production
          description: "Minecraft server deployment"

      - name: Update Deployment Status
        uses: chrnorm/deployment-status@v2.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          state: success
          deployment-id: ${{ github.run_id }}
          environment: production
          description: "Minecraft server successfully deployed"
