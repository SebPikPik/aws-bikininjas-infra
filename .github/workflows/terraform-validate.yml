name: Terraform Validate and PR

on:
  push:
    branches-ignore:
      - master

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  AWS_REGION: eu-west-3
  TF_VERSION: 1.10.5

jobs:
  terraform-validate:
    name: Terraform Validate and Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Format
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Validate
        id: validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan
        continue-on-error: true

      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate Infracost JSON
        id: infracost
        run: |
          infracost breakdown --path=tfplan --format=json --out-file=infracost.json
          infracost output --path=infracost.json --format=html --out-file=infracost.html
          infracost output --path=infracost.json --format=table --out-file=infracost-table.txt
          echo "INFRACOST_OUTPUT<<EOF" >> $GITHUB_OUTPUT
          cat infracost-table.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload Infracost Report
        uses: actions/upload-artifact@v4.3.1
        with:
          name: infracost-report
          path: infracost.html
          retention-days: 90

      - name: Get changed files
        id: changed-files
        run: |
          echo "files=$(git diff --name-only origin/master...HEAD | tr '\n' ' ')" >> $GITHUB_OUTPUT

      - name: Get commit messages and determine commit type
        id: commits
        run: |
          COMMITS=$(git log --pretty=format:"- %s" origin/master...HEAD)
          echo "commits<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          # Extract commit type from branch name or use default
          BRANCH_NAME="${{ github.ref_name }}"
          if [[ $BRANCH_NAME == feat/* || $BRANCH_NAME == feature/* ]]; then
            echo "type=feat" >> $GITHUB_OUTPUT
            echo "scope=infra" >> $GITHUB_OUTPUT
          elif [[ $BRANCH_NAME == fix/* || $BRANCH_NAME == bugfix/* ]]; then
            echo "type=fix" >> $GITHUB_OUTPUT
            echo "scope=infra" >> $GITHUB_OUTPUT
          elif [[ $BRANCH_NAME == chore/* ]]; then
            echo "type=chore" >> $GITHUB_OUTPUT
            echo "scope=infra" >> $GITHUB_OUTPUT
          elif [[ $BRANCH_NAME == docs/* ]]; then
            echo "type=docs" >> $GITHUB_OUTPUT
            echo "scope=infra" >> $GITHUB_OUTPUT
          elif [[ $BRANCH_NAME == refactor/* ]]; then
            echo "type=refactor" >> $GITHUB_OUTPUT
            echo "scope=infra" >> $GITHUB_OUTPUT
          else
            echo "type=feat" >> $GITHUB_OUTPUT
            echo "scope=infra" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@v7.0.7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "${{ steps.commits.outputs.type }}(${{ steps.commits.outputs.scope }}): apply terraform changes from ${{ github.ref_name }}"
          title: "${{ steps.commits.outputs.type }}(${{ steps.commits.outputs.scope }}): terraform changes from ${{ github.ref_name }}"
          body: |
            ## 🏗️ Terraform Changes - A New Minecraft Adventure!
            
            This PR contains the following changes to our Minecraft infrastructure:
            
            ### 📜 Commit History:
            ${{ steps.commits.outputs.commits }}
            
            ### 🔨 Changed Files:
            ```
            ${{ steps.changed-files.outputs.files }}
            ```
            
            ### 💰 Infracost Analysis:
            <details>
            <summary>Click to expand the treasure chest of cost analysis</summary>
            
            ```
            ${{ steps.infracost.outputs.INFRACOST_OUTPUT }}
            ```
            </details>
            
            ### 📋 Terraform Plan:
            <details>
            <summary>Click to reveal the blueprint</summary>
            
            ```
            ${{ steps.plan.outputs.stdout }}
            ```
            </details>
            
            > *"A well-crafted infrastructure is like a perfectly designed redstone contraption - complex but elegant."* - Minecraft Server Admin Wisdom
          branch: "terraform-changes/${{ github.ref_name }}"
          base: master
          delete-branch: true
          labels: |
            minecraft
            infrastructure
            terraform
            automated-pr
            needs-review
            diamond-pickaxe

      - name: Create Beta Release
        if: steps.validate.outcome == 'success' && steps.plan.outcome == 'success'
        uses: ncipollo/release-action@v1.13.0
        with:
          tag: "beta-${{ github.sha }}"
          name: "⚒️ Beta Release - ${{ github.ref_name }}"
          body: |
            ## 🎮 Minecraft Server Beta Release from ${{ github.ref_name }}
            
            ### 📜 Changelog:
            ${{ steps.commits.outputs.commits }}
            
            ### 🔨 Crafting Materials (Changed Files):
            ```
            ${{ steps.changed-files.outputs.files }}
            ```
            
            ### 💰 Diamond Cost Analysis:
            ```
            ${{ steps.infracost.outputs.INFRACOST_OUTPUT }}
            ```
            
            ### 🧪 Testing Instructions:
            1. 🏗️ Apply these changes to your test environment
            2. 🎮 Connect to the Minecraft server
            3. 🔍 Verify everything works as expected
            4. 📝 Report any issues in the comments
            
            > *"The best Minecraft servers are built with patience, creativity, and a touch of redstone magic."*
          prerelease: true
          generateReleaseNotes: true
          makeLatest: false
