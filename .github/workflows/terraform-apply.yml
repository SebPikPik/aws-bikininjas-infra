name: Terraform Apply

on:
  pull_request:
    types:
      - closed
    branches:
      - master

env:
  AWS_REGION: eu-west-3
  TF_VERSION: 1.10.5

jobs:
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    outputs:
      apply_success: ${{ steps.apply.outcome }}
      ecr_repository_url: ${{ steps.terraform-output.outputs.ecr_repository_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve

      - name: Get Terraform Outputs
        id: terraform-output
        if: steps.apply.outcome == 'success'
        run: |
          echo "ecr_repository_url=$(terraform output -raw ecr_repository_url)" >> $GITHUB_OUTPUT

      - name: Create Deployment Status
        if: steps.apply.outcome == 'success'
        uses: chrnorm/deployment-status@v2.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          state: success
          deployment-id: ${{ github.run_id }}
          environment: production
          description: "Terraform infrastructure successfully applied"

      - name: Notify on Failure
        if: steps.apply.outcome != 'success'
        uses: actions/github-script@v7.0.1
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Terraform apply failed. Please check the workflow logs for details.'
            })
